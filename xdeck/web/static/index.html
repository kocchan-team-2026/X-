<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X保存ボード__BN__</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="/favicon.svg" alt="" width="30" height="30"><h1>X保存ボード</h1></div>
  <nav class="boards" aria-label="ボード切替"><a href="http://localhost:__P_A__/" __A_A__>アダルト</a><a href="http://localhost:__P_E__/" __A_E__>エンタメ</a></nav>
  <div class="hsearch">
    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input id="q" class="search" type="search" placeholder="本文・投稿者・URL" aria-label="検索">
  </div>
  <span class="count" id="count"></span>
  <div class="tools">
    <div class="tgroup" role="group" aria-label="確認">
      <button class="tbtn" id="impbtn">📈 直前投稿のimp数取得</button>
      <button class="tbtn" id="sbbtn">🔍 シャドウバン判定</button>
    </div>
    <button class="btn primary hbtn" id="bulkbtn">🎲 一括予約投稿</button>
    <button class="btn hbtn" id="schedbtn">🕒 予約履歴</button>
    <button class="tbtn ghost" id="refprof" title="Xdeckのアカウント・グループ情報を取得し直して、ボードと同期する">↻ Xdeckとアカウント同期</button>
  </div>
</header>
<main class="grid" id="grid"></main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="作品の詳細" hidden></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="投稿を作成" hidden></div>
<div class="modal" id="schedpanel" role="dialog" aria-modal="true" aria-label="予約履歴" hidden></div>
<div class="modal" id="bulkpanel" role="dialog" aria-modal="true" aria-label="一括予約投稿" hidden></div>
<div class="modal" id="imppanel" role="dialog" aria-modal="true" aria-label="直前投稿のimp数取得" hidden></div>
<div class="modal" id="sbpanel" role="dialog" aria-modal="true" aria-label="シャドウバン判定" hidden></div>
<div id="toast" aria-live="polite"></div>

<script>const IS_ENT=__ENT__;</script>
<script src="/static/app.js"></script>
</body>
</html>
